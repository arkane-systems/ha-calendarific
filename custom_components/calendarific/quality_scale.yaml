# Self-assessment against the Home Assistant integration quality scale:
# https://contributors.home-assistant.io/core/quality-scale/rules/
# Home Assistant does not grade custom integrations; this file tracks the yardstick.
# The target is Platinum. Rules marked `todo` are not yet met.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide any service actions.
  appropriate-polling:
    status: todo
    comment: Every entity polls on the default 30 second interval; a coordinator should fetch once per day.
  brands: done
  common-modules:
    status: todo
    comment: There is no coordinator.py or entity.py yet.
  config-flow-test-coverage: todo
  config-flow:
    status: todo
    comment: The form fields have no data_description entries.
  dependency-transparency:
    status: exempt
    comment: The integration has no external requirements.
  docs-actions:
    status: exempt
    comment: The integration does not provide any service actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: No entity currently subscribes to events.
  entity-unique-id: done
  has-entity-name:
    status: exempt
    comment: >
      Holiday sensors are deliberately named after the holiday itself (for example
      "Christmas Day"). Prefixing the instance title would yield names such as
      "Calendarific (US - KS) Christmas Day" and long entity IDs.
  runtime-data:
    status: todo
    comment: Per-entry state lives in a flat hass.data dictionary.
  test-before-configure:
    status: todo
    comment: The config flow fetches the holiday list but reports every failure as "no holidays found".
  test-before-setup:
    status: todo
    comment: API failures are swallowed and setup always succeeds.
  unique-config-entry:
    status: todo
    comment: Config entries have no unique ID, so a country/state can be added twice.

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices:
    status: todo
    comment: The device lacks entry_type and configuration_url.
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: The integration is a cloud service and cannot be discovered.
  discovery:
    status: exempt
    comment: The integration is a cloud service and cannot be discovered.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: The integration talks to a cloud API; each instance is one virtual device.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry has exactly one device.
  entity-category:
    status: exempt
    comment: The integration has no configuration or diagnostic entities.
  entity-device-class: todo
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is part of the integration's purpose.
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency:
    status: todo
    comment: The API client uses synchronous requests in the executor.
  inject-websession: todo
  strict-typing: todo
